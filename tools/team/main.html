          <li class="person" data-reveal style="--i:2">
            <button class="person__card" type="button" data-service="nimit-shah" aria-haspopup="dialog">

              <span class="person__more">View profile <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3.5v9M3.5 8h9"/></svg></span>

          </li>
          <li class="person" data-reveal>
            <button class="person__card" type="button" data-service="rahul-hingmire" aria-haspopup="dialog">
              <img class="person__photo" src="assets/team/rahul-hingmire.webp" alt="Portrait of Rahul Hingmire" width="480" height="480" loading="lazy" decoding="async" />

              <span class="person__name">Sudhir Mehta</span>

              <span class="person__more">View profile <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3.5v9M3.5 8h9"/></svg></span>

      <!-- Profile dialog: grows from the card (js/main.js, initServices) -->
      <dialog class="svc-dialog team-dialog" aria-labelledby="team-dialog-title" data-svc-dialog data-cards=".person__card" data-prefix="team-">
        <div class="svc-dialog__panel" data-svc-panel>
          <button class="svc-dialog__close icon-btn" type="button" aria-label="Close" data-svc-close>
            <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          </button>
          <p class="svc-dialog__group" data-svc-group></p>
          <h3 class="svc-dialog__title" id="team-dialog-title" data-svc-title></h3>
          <div data-svc-body></div>
          <a class="btn svc-dialog__cta" href="#" data-svc-cta hidden></a>
        </div>
      </dialog>

      <!-- Profile copy. Edit freely. LinkedIn: add href="https://www.linkedin.com/in/…" to each .profile__linkedin. -->
      <template id="team-monica-gupta" data-group="Co-founder and CEO" data-title="CA Monica Gupta">
