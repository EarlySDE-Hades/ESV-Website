        <figure class="tool rf tk-tool" data-round-finder>
          <p class="tool__eyebrow">Find your round</p>
          <div class="rf__steps" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
          <div class="rf__stage" aria-live="polite">
            <div class="rf__q" data-q="0" data-no="ff">
              <p class="rf__num">Question 1 of 7</p>
              <p class="rf__text">Do you have a committed founding team and a clear problem to solve?</p>
              <div class="rf__btns"><button type="button" class="btn" data-answer="yes">Yes</button><button type="button" class="btn btn--ghost" data-answer="no">Not yet</button></div>
            </div>
            <div class="rf__q" data-q="1" data-no="preseed" hidden>
              <p class="rf__num">Question 2 of 7</p>
              <p class="rf__text">Have real users tried your product or prototype?</p>
              <div class="rf__btns"><button type="button" class="btn" data-answer="yes">Yes</button><button type="button" class="btn btn--ghost" data-answer="no">Not yet</button></div>
            </div>
            <div class="rf__q" data-q="2" data-no="seed" hidden>
              <p class="rf__num">Question 3 of 7</p>
              <p class="rf__text">Do you have paying customers, or strong usage you can measure?</p>
              <div class="rf__btns"><button type="button" class="btn" data-answer="yes">Yes</button><button type="button" class="btn btn--ghost" data-answer="no">Not yet</button></div>
            </div>
            <div class="rf__q" data-q="3" data-no="seedbridge" hidden>
              <p class="rf__num">Question 4 of 7</p>
              <p class="rf__text">Is your revenue growing steadily, month after month?</p>
              <div class="rf__btns"><button type="button" class="btn" data-answer="yes">Yes</button><button type="button" class="btn btn--ghost" data-answer="no">Not yet</button></div>
            </div>
            <div class="rf__q" data-q="4" data-no="preA" hidden>
              <p class="rf__num">Question 5 of 7</p>
              <p class="rf__text">Can you win customers again and again, and does each one make you money?</p>
              <div class="rf__btns"><button type="button" class="btn" data-answer="yes">Yes</button><button type="button" class="btn btn--ghost" data-answer="no">Not yet</button></div>
            </div>
            <div class="rf__q" data-q="5" data-no="A" hidden>
              <p class="rf__num">Question 6 of 7</p>
              <p class="rf__text">Do you know where your next rupee of growth spend goes, and what it brings back?</p>
              <div class="rf__btns"><button type="button" class="btn" data-answer="yes">Yes</button><button type="button" class="btn btn--ghost" data-answer="no">Not yet</button></div>
            </div>
            <div class="rf__q" data-q="6" data-no="B" hidden>
              <p class="rf__num">Question 7 of 7</p>
              <p class="rf__text">Is your core business proven, and are you ready for new markets or products?</p>
              <div class="rf__btns"><button type="button" class="btn" data-answer="yes">Yes</button><button type="button" class="btn btn--ghost" data-answer="no">Not yet</button></div>
            </div>
            <div class="rf__result" data-result="ff" hidden>
              <p class="rf__num">You are probably raising</p>
              <p class="rf__round">Friends and family</p>
              <p class="rf__why">You are still at the idea. Founders, friends and family usually back this stage.</p>
              <p class="rf__range"><span>Typical raise in India</span>Not tracked as a separate stage</p>
            </div>
            <div class="rf__result" data-result="preseed" hidden>
              <p class="rf__num">You are probably raising</p>
              <p class="rf__round">Pre-seed</p>
              <p class="rf__why">Investors are backing the team and the problem. Angels, angel networks and accelerators lead here.</p>
              <p class="rf__range"><span>Typical raise in India</span>₹50 lakh to ₹2.5 crore</p>
            </div>
            <div class="rf__result" data-result="seed" hidden>
              <p class="rf__num">You are probably raising</p>
              <p class="rf__round">Seed</p>
              <p class="rf__why">You have a product people use. Seed funds and early-stage VCs want early signs that people want it.</p>
              <p class="rf__range"><span>Typical raise in India</span>₹2 crore to ₹17 crore</p>
            </div>
            <div class="rf__result" data-result="seedbridge" hidden>
              <p class="rf__num">You are probably raising</p>
              <p class="rf__round">Seed, or a bridge</p>
              <p class="rf__why">You have customers, but growth is not yet steady. Many founders raise a seed extension or bridge here.</p>
              <p class="rf__range"><span>Typical raise in India</span>Bridge rounds are not tracked separately</p>
            </div>
            <div class="rf__result" data-result="preA" hidden>
              <p class="rf__num">You are probably raising</p>
              <p class="rf__round">Pre-Series A</p>
              <p class="rf__why">Revenue is growing, but the growth engine is not yet repeatable. Existing investors often lead.</p>
              <p class="rf__range"><span>Typical raise in India</span>Not tracked as a separate stage</p>
            </div>
            <div class="rf__result" data-result="A" hidden>
              <p class="rf__num">You are probably raising</p>
              <p class="rf__round">Series A</p>
              <p class="rf__why">You have product-market fit and a repeatable way to win customers. Institutional VCs lead.</p>
              <p class="rf__range"><span>Typical raise in India</span>₹22 crore to ₹90 crore</p>
            </div>
            <div class="rf__result" data-result="B" hidden>
              <p class="rf__num">You are probably raising</p>
              <p class="rf__round">Series B</p>
              <p class="rf__why">The numbers per customer work and you are ready to scale. Growth-focused VCs lead.</p>
              <p class="rf__range"><span>Typical raise in India</span>₹45 crore to ₹215 crore</p>
            </div>
            <div class="rf__result" data-result="C" hidden>
              <p class="rf__num">You are probably raising</p>
              <p class="rf__round">Series C or later</p>
              <p class="rf__why">A proven business, expanding into new markets or products. Late-stage VCs and PE funds.</p>
              <p class="rf__range"><span>Typical raise in India</span>₹70 crore to ₹450 crore</p>
            </div>
          </div>
          <div class="rf__foot"><button type="button" class="rf__back" data-back hidden>Back</button><button type="button" class="rf__back" data-restart hidden>Start again</button></div>
          <ol class="rf__fallback"><li>Do you have a committed founding team and a clear problem to solve? If not: <strong>Friends and family</strong>.</li><li>Have real users tried your product or prototype? If not: <strong>Pre-seed</strong>.</li><li>Do you have paying customers, or strong usage you can measure? If not: <strong>Seed</strong>.</li><li>Is your revenue growing steadily, month after month? If not: <strong>Seed, or a bridge</strong>.</li><li>Can you win customers again and again, and does each one make you money? If not: <strong>Pre-Series A</strong>.</li><li>Do you know where your next rupee of growth spend goes, and what it brings back? If not: <strong>Series A</strong>.</li><li>Is your core business proven, and are you ready for new markets or products? If not: <strong>Series B</strong>.</li></ol>
          <figcaption>Round names are not standard: one fund’s seed is another’s pre-Series A. Typical raise: the middle half of disclosed Indian rounds, October 2025 to September 2026 (Tracxn).</figcaption>
        </figure>
