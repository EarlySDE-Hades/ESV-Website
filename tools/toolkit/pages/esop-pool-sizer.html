        <figure class="tool tk-tool" data-calc="pool">
          <p class="tk-step">1. Who will you hire before your next round?</p>
          <div class="tk-hires">
              <div class="tk-hire" data-hire>
                <label class="tk-field"><span>Role</span><span class="tk-input"><input type="text" value="Leadership (CTO, VP)" aria-label="Role" /></span></label>
                <label class="tk-field"><span>Hires</span><span class="tk-input"><input type="number" inputmode="decimal" min="0" step="1" value="2" data-in="n" /><em>people</em></span></label>
                <label class="tk-field"><span>Grant each</span><span class="tk-input"><input type="number" inputmode="decimal" min="0" step="any" value="1.5" data-in="g" /><em>%</em></span></label>
              </div>
              <div class="tk-hire" data-hire>
                <label class="tk-field"><span>Role</span><span class="tk-input"><input type="text" value="Senior team" aria-label="Role" /></span></label>
                <label class="tk-field"><span>Hires</span><span class="tk-input"><input type="number" inputmode="decimal" min="0" step="1" value="4" data-in="n" /><em>people</em></span></label>
                <label class="tk-field"><span>Grant each</span><span class="tk-input"><input type="number" inputmode="decimal" min="0" step="any" value="0.5" data-in="g" /><em>%</em></span></label>
              </div>
              <div class="tk-hire" data-hire>
                <label class="tk-field"><span>Role</span><span class="tk-input"><input type="text" value="Early team" aria-label="Role" /></span></label>
                <label class="tk-field"><span>Hires</span><span class="tk-input"><input type="number" inputmode="decimal" min="0" step="1" value="10" data-in="n" /><em>people</em></span></label>
                <label class="tk-field"><span>Grant each</span><span class="tk-input"><input type="number" inputmode="decimal" min="0" step="any" value="0.1" data-in="g" /><em>%</em></span></label>
              </div>
              <div class="tk-hire" data-hire>
                <label class="tk-field"><span>Role</span><span class="tk-input"><input type="text" value="Others" aria-label="Role" /></span></label>
                <label class="tk-field"><span>Hires</span><span class="tk-input"><input type="number" inputmode="decimal" min="0" step="1" value="0" data-in="n" /><em>people</em></span></label>
                <label class="tk-field"><span>Grant each</span><span class="tk-input"><input type="number" inputmode="decimal" min="0" step="any" value="0.05" data-in="g" /><em>%</em></span></label>
              </div>
          </div>
          <label class="tk-field"><span>Buffer for surprises</span><span class="tk-input"><input type="number" inputmode="decimal" min="0" step="any" value="20" data-in="buffer" /><em>% extra</em></span><small>Hires you have not planned yet, and top-ups for people who stay</small></label>
          <p class="tk-step">2. The round</p>
          <div class="tk-form">
            <label class="tk-field"><span>Pre-money valuation</span><span class="tk-input"><input type="number" inputmode="decimal" min="0" step="any" value="12" data-in="pre" /><em>₹ crore</em></span></label>
            <label class="tk-field"><span>Raising</span><span class="tk-input"><input type="number" inputmode="decimal" min="0" step="any" value="3" data-in="raise" /><em>₹ crore</em></span></label>
          </div>
          <div class="tk-results">
            <p class="tk-out tk-out--big"><span>Pool you need</span><strong data-out="pool">–</strong></p>
            <p class="tk-out tk-out--big"><span>Worth at this round’s price</span><strong data-out="worth">–</strong></p>
            <p class="tk-out"><span>Your effective pre-money</span><strong data-out="eff">–</strong></p>
            <p class="tk-out"><span>Cost to founders, if in the pre-money</span><strong data-out="cost">–</strong></p>
          </div>
          <figcaption data-out="note"></figcaption>
        </figure>
