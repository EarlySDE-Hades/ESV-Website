  <main id="main" class="pf-page">
    <!-- ============================== Portfolio ============================== -->
    <!-- From the Figma mockup (Figma Source/Portfolio). Cards are generated from tools/portfolio/companies.json
         by tools/team/build.py (double-brace placeholders). Search and the sector filter: js initPortfolioFilter.
         .pf-card__media wraps each photo so the images can be animated later without touching the cards. -->
    <section class="pf-head" aria-labelledby="pf-title">
      <div class="container pf-head__inner">
        <p class="eyebrow" data-reveal>Our portfolio</p>
        <h1 class="pf-head__title" id="pf-title" data-reveal style="--i:1">Backed early. Growing fast.</h1>
        <p class="pf-head__sub" data-reveal style="--i:2">The companies we have raised for and invested in, from rural commerce and spacetech to prebiotic soda.</p>
        <dl class="pf-stats" data-reveal style="--i:3">
          <div><dt>Companies</dt><dd>{{COUNT}}</dd></div>
          <div><dt>Sectors</dt><dd>{{SECTOR_COUNT}}</dd></div>
          <div><dt>Cities</dt><dd>{{CITY_COUNT}}</dd></div>
        </dl>
      </div>
    </section>

    <section class="pf-list" aria-label="Portfolio companies">
      <div class="container pf-list__inner">
        <form class="pf-tools" role="search" data-pf-filter data-reveal onsubmit="return false">
          <label class="pf-search">
            <span class="visually-hidden">Search companies</span>
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="10" cy="10" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="m15 15 5.5 5.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
            <input type="search" placeholder="Search by name, city or what they do" autocomplete="off" data-pf-q />
          </label>
          <label class="pf-select">
            <span class="visually-hidden">Sector</span>
            <select data-pf-sector>
              <option value="">All sectors</option>
{{SECTOR_OPTIONS}}
            </select>
            <svg viewBox="0 0 12 12" width="12" height="12" aria-hidden="true"><path d="M2.5 4.5 6 8l3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </label>
          <p class="pf-count" aria-live="polite" data-pf-count>{{COUNT}} companies</p>
        </form>
        <ul class="pf-grid" role="list" data-pf-grid>
{{GRID}}
        </ul>
        <div class="pf-empty" hidden data-pf-empty>
          <p>No companies match that search.</p>
          <button class="btn btn--ghost" type="button" data-pf-reset>Clear filters</button>
        </div>
      </div>
    </section>
  </main>
